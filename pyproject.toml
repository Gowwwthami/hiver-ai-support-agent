[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiver-ba-support"
version = "0.3.0"
description = "Hiver SDE Intern take-home: British_Airways customer-support intent classification, historical-response retrieval, grounded drafting and escalation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "scikit-learn>=1.6",
    "duckdb>=1.5",
    "pyarrow>=17",
    "tabulate>=0.9",
    "joblib>=1.4",
]

[project.optional-dependencies]
judge = ["openai>=1.0", "google-genai>=1.0"]
semantic = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
include = ["ba_support*", "evaluation*"]